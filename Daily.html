
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis Dashboard</title>
  <link rel="stylesheet" href="./css/Daily.css">
</head>
<body>
  
  <main class="phone">
    <section class="top">
      <div class="status">
              <span>16:04</span>
        
      </div>
      <header class="header">
        <img src="./poblic/image/bring back.png" alt="">
        <h1>Analysis</h1>
        <img src="./poblic/image/Icon-Notification.png" alt="">

      </header>

      <div class="summary">
        <div class="summary-item">
          <span class="small-label">
            <span class="tiny-icon">↗</span>
            Total Balance
          </span>
          <strong>$7,783.00</strong>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-item expense-summary">
          <span class="small-label">
            <span class="tiny-icon">↘</span>
            Total Expense
          </span>
          <strong>-$1,187.40</strong>
        </div>
      </div>

      <div class="progress-row">
        <span class="progress-percent">30%</span>
        <span class="progress-track">
          <b>$20,000.00</b>
        </span>
      </div>

      <p class="good">
        <span>☑</span>
        30% Of Your Expenses, Looks Good.
      </p>
    </section>

    <section class="content">
      <nav class="period-tabs">
        <a href="#daily" class="active">Daily</a>
        <a href="#weekly">Weekly</a>
        <a href="#monthly">Monthly</a>
        <a href="#year">Year</a>
      </nav>

      <section class="chart-card">
        <div class="chart-heading">
          <h2>Income &amp; Expenses</h2>

          <div class="chart-actions">
            <button>⌕</button>
            <img src="./poblic/image/Calender.png" alt="">
          </div>
        </div>

        <div class="chart">
          <div class="y-labels">
            <span>15k</span>
            <span>10k</span>
            <span>5k</span>
            <span>1k</span>
          </div>

          <div class="plot">
            <div class="gridline g1"></div>
            <div class="gridline g2"></div>
            <div class="gridline g3"></div>
            <div class="gridline g4"></div>

            <div class="bars">
              <div class="day-bars">
                <i class="bar income" style="height:42%"></i>
                <i class="bar expense" style="height:63%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:12%"></i>
                <i class="bar expense" style="height:36%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:61%"></i>
                <i class="bar expense" style="height:28%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:7%"></i>
                <i class="bar expense" style="height:44%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:75%"></i>
                <i class="bar expense" style="height:68%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:24%"></i>
                <i class="bar expense" style="height:5%"></i>
              </div>

              <div class="day-bars">
                <i class="bar income" style="height:0%"></i>
                <i class="bar expense" style="height:54%"></i>
              </div>
            </div>

            <div class="x-labels">
              <span>Mon</span>
              <span>Tue</span>
              <span>Wed</span>
              <span>Thu</span>
              <span>Fri</span>
              <span>Sat</span>
              <span>Sun</span>
            </div>
          </div>
        </div>
      </section>

      <section class="totals">
        <div class="total-item">
          <div class="total-icon income-icon">↗</div>
          <span>Income</span>
          <strong>$4,120.00</strong>
        </div>

        <div class="total-item">
          <div class="total-icon expense-icon">↘</div>
          <span>Expense</span>
          <strong class="blue">$1,187.40</strong>
        </div>
      </section>

      <h2 class="targets-title">My Targets</h2>
    </section>

    <nav class="bottom-nav">
      <a href="#" aria-label="Home">
        <svg viewBox="0 0 24 24">
          <path d="M3 10.5 12 3l9 7.5V21H5V10.5M9 21v-7h6v7"/>
        </svg>
      </a>

      <a href="#" class="selected" aria-label="Analysis">
       <img src="./poblic/image/Analysis.png" alt="">
          <path d="M4 20V10M9 20V5M14 20v-7M19 20V8M2 21h20"/>
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </a>

      <a href="#" aria-label="Transfer">
        <svg viewBox="0 0 24 24">
          <path d="M3 8h17l-4-4M21 16H4l4 4"/>
        </svg>
      </a>

      <a href="#" aria-label="Cards">
        <svg viewBox="0 0 24 24">
          <path d="m12 3 9 4.5-9 4.5-9-4.5L12 3ZM3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>
        </svg>
      </a>

      <a href="#" aria-label="Profile">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="4"/>
          <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
        </svg>
      </a>
    </nav>
  </main>
</body>
</html>
